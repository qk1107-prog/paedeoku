<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>패더쿠 · 패션 할인 소식 제일 빠른 곳</title>
<meta name="description" content="무진장 블프 시간표, 오늘의 할인템, 카테고리별 꿀템을 한 번에. 매일 업데이트.">
<meta property="og:title" content="패더쿠 · 패션 할인 소식 제일 빠른 곳">
<meta property="og:description" content="무진장 블프 시간표 · 오늘의 할인템 · 카테고리 꿀템">
<meta name="theme-color" content="#FAF7F3">
<link rel="preconnect" href="https://image.msscdn.net">
<style>
:root{--ink:#1E1B19;--sub:#7D746F;--bg:#FAF7F3;--line:#EEE7E0;--vio:#C9BCFF;--lime:#E4FF1A;--red:#FF4B4B;--blue:#BFD4FF;--pink:#FFE1E1;--gray:#ECE9E6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding-bottom:40px}
header{display:flex;align-items:center;gap:16px;padding:26px 18px 18px}
.av{width:72px;height:72px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:none}
.nm{margin:0;font-size:20px;font-weight:700}
.bio{margin:4px 0 0;font-size:13px;line-height:1.55;color:var(--sub)}
.bio b{color:var(--ink)}
.bfmini{margin:0 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;border:0;width:calc(100% - 36px);text-align:left;cursor:pointer}
.bfmini b{display:block;font-size:15px}
.bfmini small{font-size:12px;color:#CFC8C2}
.bfmini .r{font-size:13px;font-weight:700;color:var(--lime);white-space:nowrap}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px}
.sec-h p{margin:0;font-size:18px;font-weight:700}
.sec-h span{font-size:12px;color:var(--sub)}
.lu{padding:22px 0 6px}
.lu .sec-h{padding:0 18px}
.lu .sec-h p{font-size:14px;letter-spacing:1px}
.hs{display:flex;gap:10px;overflow-x:auto;padding:0 18px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hs::-webkit-scrollbar,.chips::-webkit-scrollbar,nav::-webkit-scrollbar,.days::-webkit-scrollbar{display:none}
.luc{flex:none;width:62%;aspect-ratio:4/5;position:relative;border-radius:18px;overflow:hidden;background:#E8E3DE;scroll-snap-align:start;color:#fff}
.luc img{width:100%;height:100%;object-fit:cover;display:block}
.luc .st{position:absolute;left:12px;top:12px;font-size:12px;font-weight:700;color:var(--ink);background:var(--lime);border-radius:6px;padding:3px 8px}
.luc .sh{position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.6))}
.luc .tx{position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-direction:column;gap:4px}
.luc .eb{font-size:12px;opacity:.9}
.luc .hd{font-size:19px;font-weight:700;line-height:1.3}
.luc .go{font-size:11px;font-weight:700;margin-top:4px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:18px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 18px;margin-top:14px;scrollbar-width:none}
nav button{flex:none;border:0;background:none;font-size:15px;font-weight:500;color:var(--sub);padding:14px 0 11px;border-bottom:2px solid transparent;cursor:pointer;min-height:44px}
nav button.on{font-weight:700;color:var(--ink);border-bottom-color:var(--ink)}
section.tab{display:none;padding:20px 18px 0}
section.tab.on{display:block}
.blk{margin-bottom:26px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:7px;padding:4px 8px 3px;white-space:nowrap;background:var(--gray)}
.t-vio{background:var(--vio)}.t-lime{background:var(--lime)}.t-red{background:var(--red);color:#fff}.t-blue{background:var(--blue)}.t-ink{background:var(--ink);color:#fff}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pdc{background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:5px;border:1.5px solid transparent}
.pdc.on{border-color:var(--ink)}
.pdc b{font-size:14px}.pdc span{font-size:12px;color:var(--sub)}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.day{flex:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px 6px}
.day b{display:block;font-size:12px}.day span{display:block;font-size:11px;color:var(--sub);white-space:nowrap}
.day.hot{background:var(--pink);border-color:#FFC9C9}
.day.now{background:var(--ink);color:#fff;border-color:var(--ink)}.day.now span{color:#ddd}
.day.past{opacity:.45}
.rd{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.rdc{background:#fff;border-radius:10px;padding:8px 4px;text-align:center}
.rdc b{display:block;font-size:12px}.rdc span{display:block;font-size:11px;color:var(--sub)}.rdc em{display:block;font-style:normal;font-size:10.5px;margin-top:2px;line-height:1.3}
.rdc.on{background:var(--lime)}
.cp{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:6px}
.cp .tg{width:92px;flex:none}
.cp b{display:block;font-size:13px}.cp span{font-size:12px;color:var(--sub)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;font-size:14px;font-weight:500;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:38px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 8px}
.it{display:flex;flex-direction:column;gap:2px;min-width:0}
.im{position:relative;width:100%;aspect-ratio:5/6;border-radius:12px;overflow:hidden;background:#F2EFEC}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.rk{position:absolute;left:7px;top:7px;font-size:12px;font-weight:700;color:#fff;background:var(--ink);border-radius:6px;padding:2px 7px}
.br{margin-top:7px;font-size:12px;font-weight:500;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font-size:14px;font-weight:700}.pr i{font-style:normal;color:var(--red);margin-right:3px}
.more{display:block;width:100%;text-align:center;font-size:14px;font-weight:500;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:16px;cursor:pointer;min-height:44px}
.stamp{font-size:12px;color:var(--sub);margin:-4px 0 12px}
.empty{font-size:13px;color:var(--sub);padding:30px 0;text-align:center}
footer{padding:30px 18px 0;font-size:11px;line-height:1.6;color:var(--sub)}
</style>
</head>
<body>
<div class="app">
<header>
<div class="av" aria-hidden="true">패더쿠</div>
<div>
<p class="nm">패더쿠</p>
<p class="bio"><b>패션 할인 소식 제일 빠른 곳</b><br>무진장 블프 · 오늘의 할인템 · 핫템만 골라서 정리</p>
</div>
</header>
<button class="bfmini" id="bfmini" type="button"><span><b>무진장 블프</b><small>쿠폰 · 특가 · 꿀템 한 번에 정리</small></span><span class="r" id="bfcd">시간표 보기 →</span></button>
<div class="lu"><div class="sec-h"><p>LINE UP</p><span>무신사 실시간 인기</span></div><div class="hs" id="lu"></div></div>
<nav id="tabs">
<button data-t="bf" class="on">무진장 블프</button>
<button data-t="today">오늘의 할인</button>
<button data-t="cats">카테고리 꿀템</button>
<button data-t="mood">분위기별</button>
<button data-t="hot">실시간 랭킹</button>
</nav>
<section class="tab on" id="t-bf"></section>
<section class="tab" id="t-today"></section>
<section class="tab" id="t-cats"></section>
<section class="tab" id="t-mood"></section>
<section class="tab" id="t-hot"></section>
<footer>이 사이트의 링크로 구매하면 큐레이터 수수료를 받을 수 있어요 · 가격·할인율은 업데이트 시점 기준이라 지금과 다를 수 있어요 · 무신사 공식 계정이 아니에요</footer>
</div>
<script>
(function(){
var D={};
var IMG='https://image.msscdn.net';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function won(n){return n?Number(n).toLocaleString('ko-KR')+'원':''}
function link(x){return /^[A-Za-z0-9]{4,12}$/.test(x.l||'')?'https://www.musinsa.com/curator/goods/'+x.l:'#'}
function img(p,id){p=String(p||'');var m=p.match(/^(p?)(\d{8})_(\d+)(\.(png|jpeg|webp))?$/);if(m&&/^\d+$/.test(id||''))return IMG+'/images/'+(m[1]?'prd_img':'goods_img')+'/'+m[2]+'/'+id+'/'+(m[1]?'detail_':'')+id+'_'+m[3]+'_500'+(m[4]||'.jpg');if(/^\/[\w\/.\-]+$/.test(p))return IMG+p;return ''}
function expand(z){if(!z||!z.P)return z||{};var P=z.P;function L(a){return (a||[]).map(function(id){var x=P[id];return x?{id:id,b:x[0],n:x[1],img:x[2],p:x[3],r:x[4],l:x[5]}:null}).filter(Boolean)}var o={at:z.at,cats:{},mood:{},today:L(z.today),hot:L(z.hot),lineup:L(z.lineup)};for(var k in z.cats)o.cats[k]=L(z.cats[k]);for(var k2 in z.mood)o.mood[k2]=L(z.mood[k2]);return o}
function card(x,rank){return '<a class="it" href="'+esc(link(x))+'" target="_blank" rel="noopener sponsored"><div class="im">'+(img(x.img,x.id)?'<img src="'+esc(img(x.img,x.id))+'" alt="'+esc(x.b+' '+x.n)+'" loading="lazy" referrerpolicy="no-referrer">':'')+(rank?'<span class="rk">'+rank+'</span>':'')+'</div><span class="br">'+esc(x.b)+'</span><span class="pn">'+esc(x.n)+'</span><span class="pr">'+(x.r>0?'<i>'+x.r+'%</i>':'')+esc(won(x.p))+'</span></a>'}
function grid(id,list,rank,step){step=step||12;var el=document.getElementById(id);if(!el)return;if(!list||!list.length){el.innerHTML='<p class="empty">정리 중이에요 · 곧 올라와요</p>';return}var n=Math.min(step,list.length);function draw(){el.innerHTML='<div class="grid">'+list.slice(0,n).map(function(x,i){return card(x,rank?i+1:0)}).join('')+'</div>'+(n<list.length?'<button type="button" class="more">더 보기 ('+list.length+'개) ↓</button>':'');var b=el.querySelector('.more');if(b)b.onclick=function(){n=list.length;draw()}}draw()}
function chips(id,labels,on,cb){var el=document.getElementById(id);el.innerHTML=labels.map(function(l){return '<button type="button" class="chip'+(l===on?' on':'')+'" data-v="'+esc(l)+'">'+esc(l)+'</button>'}).join('');el.onclick=function(e){var b=e.target.closest('.chip');if(!b)return;el.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('on',c===b)});cb(b.getAttribute('data-v'))}}
function stamp(){if(!D.at)return '';var d=new Date(D.at);var k=new Date(d.getTime()+9*3600e3);return '<p class="stamp">'+(k.getUTCMonth()+1)+'.'+k.getUTCDate()+' '+String(k.getUTCHours()).padStart(2,'0')+':'+String(k.getUTCMinutes()).padStart(2,'0')+' 업데이트</p>'}
// ---- 블프 ----
var SCH=[['11-20','티징','hot'],['11-21','티징'],['11-22','본편 오픈','hot'],['11-23','아우터·킥스'],['11-24','아우터·킥스'],['11-25','상의·하의'],['11-26','상의·하의'],['11-27','단독 하루특가','hot'],['11-28','뷰티·잡화'],['11-29','뷰티·잡화'],['11-30','무료배송'],['12-01','무료배송'],['12-02','파이널','hot']];
var RD=[['1회차','11.22~24','아우터·킥스','11-22','11-24'],['2회차','11.25~27','상의·하의','11-25','11-27'],['3회차','11.28~29','뷰티·잡화','11-28','11-29'],['4회차','11.30~12.1','무료배송·무탠다드','11-30','12-01'],['파이널','12.2','앙코르','12-02','12-02']];
var CP=[['티징 쿠폰','t-vio','11.20(금) 19시 ~ 21(토)','본편 전 이틀만 열리는 쿠폰'],['시그니처특가','t-ink','11.22(일) 19시 ~ 12.2','1,500개 넘는 상품 단독·최저가'],['회차 쿠폰','t-lime','11.22 · 25 · 28 · 30 · 12.2','회차 바뀔 때마다 새 쿠폰'],['하루특가','t-red','11.22 · 11.27 · 12.2','그날 하루만, 밤 12시에 끝'],['라이브 할인','t-blue','11.23 ~ 12.2 중 8일 · 19~21시','방송 중에만 받는 할인'],['무료배송','','11.30(월) ~ 12.1(화)','무배 데이 + 무탠다드 집중 할인']];
function kst(){var d=new Date(Date.now()+9*3600e3);return {md:String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'),t:Date.now()}}
var T_TEASE=Date.parse('2026-11-20T19:00:00+09:00'),T_OPEN=Date.parse('2026-11-22T19:00:00+09:00'),T_END=Date.parse('2026-12-03T00:00:00+09:00');
function renderBF(){var k=kst();var el=document.getElementById('t-bf');
var h='<div class="blk"><div class="sec-h"><p>블프 시간표</p><span>날짜만 보면 끝</span></div>'+
'<div class="pd"><div class="pdc'+(k.t>=T_TEASE&&k.t<T_OPEN?' on':'')+'"><span class="tag t-vio">티징</span><b>11.20 19시 ~ 11.21</b><span>티징 쿠폰 · SPA·뷰티 특가</span></div><div class="pdc'+(k.t>=T_OPEN&&k.t<T_END?' on':'')+'"><span class="tag t-lime">본편</span><b>11.22 19시 ~ 12.2</b><span>시그니처특가 · 브랜드데이</span></div></div>'+
'<div class="days">'+SCH.map(function(s){var st=s[0]===k.md?'now':(s[0]<k.md?'past':(s[2]||''));return '<div class="day '+st+'"><b>'+s[0].replace('-','.')+'</b><span>'+esc(s[1])+'</span></div>'}).join('')+'</div>'+
'<div class="rd">'+RD.map(function(r){return '<div class="rdc'+(k.md>=r[3]&&k.md<=r[4]?' on':'')+'"><b>'+r[0]+'</b><span>'+r[1]+'</span><em>'+r[2]+'</em></div>'}).join('')+'</div></div>'+
'<div class="blk"><div class="sec-h"><p>쿠폰·혜택 정리</p><span>무신사 공지 기준</span></div>'+CP.map(function(c){return '<div class="cp"><span class="tg"><span class="tag '+c[1]+'">'+c[0]+'</span></span><span><b>'+c[2]+'</b><span>'+c[3]+'</span></span></div>'}).join('')+'</div>'+
'<div class="blk"><div class="sec-h"><p>지금 할인 큰 꿀템</p><span>후기 많은 순</span></div>'+stamp()+'<div id="bf-grid"></div></div>';
el.innerHTML=h;grid('bf-grid',(D.today||[]).slice(0,12),false,12);
var cd=document.getElementById('bfcd');if(k.t<T_OPEN){var m=Math.max(0,Math.floor((T_OPEN-k.t)/6e4));cd.textContent='본편까지 '+Math.floor(m/60)+'시간 '+(m%60)+'분 →'}else if(k.t<T_END){cd.textContent='지금 진행 중 →'}}
function renderToday(){var el=document.getElementById('t-today');el.innerHTML='<div class="sec-h"><p>오늘의 할인</p><span>30% 이상 · 후기 많은 순</span></div>'+stamp()+'<div id="td-grid"></div>';grid('td-grid',D.today||[],false,12)}
var CAT=['아우터','상의','바지','스커트·원피스','신발','가방','소품'],AGE=['10대','20대','30대'],cc='아우터',ca='20대';
function renderCats(){var el=document.getElementById('t-cats');el.innerHTML='<div class="sec-h"><p>카테고리 꿀템</p><span>무신사 여성 랭킹 기준</span></div>'+stamp()+'<div class="chips" id="c-age"></div><div class="chips" id="c-cat"></div><div id="c-grid"></div>';
function go(){grid('c-grid',(D.cats||{})[cc+'|'+ca],true,12)}
chips('c-age',AGE,ca,function(v){ca=v;go()});chips('c-cat',CAT,cc,function(v){cc=v;go()});go()}
function renderMood(){var el=document.getElementById('t-mood');var M=Object.keys(D.mood||{});var cm=M[0];el.innerHTML='<div class="sec-h"><p>분위기별 꿀템</p><span>20대 여성 인기순</span></div>'+stamp()+'<div class="chips" id="m-chip"></div><div id="m-grid"></div>';if(!M.length){grid('m-grid',[]);return}chips('m-chip',M,cm,function(v){grid('m-grid',D.mood[v],true,12)});grid('m-grid',D.mood[cm],true,12)}
function renderHot(){var el=document.getElementById('t-hot');el.innerHTML='<div class="sec-h"><p>실시간 랭킹</p><span>무신사 여성 실시간</span></div>'+stamp()+'<div id="h-grid"></div>';grid('h-grid',D.hot||[],true,12)}
function renderLU(){var L=(D.lineup&&D.lineup.length?D.lineup:(D.hot||[]).slice(0,5));document.getElementById('lu').innerHTML=L.map(function(x){return '<a class="luc" href="'+esc(link(x))+'" target="_blank" rel="noopener sponsored">'+(img(x.img,x.id)?'<img src="'+esc(img(x.img,x.id).replace('_500.','_big.'))+'" alt="'+esc(x.b+' '+x.n)+'" referrerpolicy="no-referrer">':'')+'<span class="st">'+(x.r>=10?x.r+'% OFF':'HOT')+'</span><span class="sh"></span><span class="tx"><span class="eb">'+esc(x.b)+'</span><span class="hd">'+esc(x.h||x.n)+'</span><span class="go">TAP IN →</span></span></a>'}).join('')}
document.getElementById('tabs').onclick=function(e){var b=e.target.closest('button');if(!b)return;var t=b.getAttribute('data-t');document.querySelectorAll('nav button').forEach(function(x){x.classList.toggle('on',x===b)});document.querySelectorAll('section.tab').forEach(function(s){s.classList.toggle('on',s.id==='t-'+t)});try{history.replaceState(null,'','#'+t)}catch(e){}};
document.getElementById('bfmini').onclick=function(){document.querySelector('nav button[data-t=bf]').click();document.getElementById('tabs').scrollIntoView({behavior:'smooth'})};
fetch('/api/sd?id=pdk').then(function(r){return r.json()}).catch(function(){return {}}).then(function(d){D=expand(d||{});renderLU();renderBF();renderToday();renderCats();renderMood();renderHot();var h=location.hash.slice(1);var b=h&&document.querySelector('nav button[data-t="'+h.replace(/[^a-z]/g,'')+'"]');if(b)b.click();setInterval(renderBFcd,60000)});
function renderBFcd(){var k=kst();var cd=document.getElementById('bfcd');if(k.t<T_OPEN){var m=Math.max(0,Math.floor((T_OPEN-k.t)/6e4));cd.textContent='본편까지 '+Math.floor(m/60)+'시간 '+(m%60)+'분 →'}}
})();
</script>
</body>
</html>
